name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# bash explicitly: Actions then runs each step with -eo pipefail. Left to the
# default it is "bash -e", and a build piped into tee or grep that fails does
# not fail the step.
defaults:
  run:
    shell: bash

jobs:
  # Native arm64, the main target: the JIT and NEON paths on real silicon, and
  # the binaries a handheld runs (see Package for the two tarballs). Other
  # devices build with their own toolchains; what they share with this job is
  # the committed PGO profiles (pgo/<arch>[-gcc<ver>]/), not a CI variant.
  # Every job packages the same way: see tools/ci_package.sh.
  # A pull request is built and tested only: no tarballs (its ref name,
  # "<number>/merge", is no file name: the Package step failed on every one),
  # and no second, static build with its tests run again.
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev: the headers only; nothing links libvulkan (it is
          # dlopen'd on the device). Without them the build silently has no
          # GPU 3D raster and no Vulkan present -- the configure check below
          # refuses that.
          sudo apt-get install -y ninja-build libsdl2-dev libvulkan-dev
      # Profile-guided, from the profile committed under pgo/aarch64/ (made on a
      # developer machine with the ROMs by tools/pgo_refresh.sh). The configure
      # fails if the runner's compiler or the flags no longer match the
      # profile's MANIFEST -- refresh it, do not silently ship an unprofiled
      # build. STRICT keeps the per-function mismatch warnings in the log.
      - name: Build and test
        run: |
          cmake --preset host -DDSPERATE_PGO=use -DDSPERATE_PGO_STRICT=ON | tee configure.log
          grep -q "Vulkan presenter and 3D raster enabled" configure.log || { echo "::error::Vulkan headers not found: the build would ship without GPU 3D and the Vulkan present"; exit 1; }
          # "source locations ... have changed" is benign (the checkout path is
          # in the checksum; the counts still apply) and one per function, so it
          # is filtered; "control flow ... does not match" is a dropped profile.
          cmake --build --preset host 2>&1 | { grep -v "source locations for function" || true; } | tee build.log
          echo "PGO: $(grep -c 'control flow of function' build.log || true) functions changed since the profile ($(sed -n 's/^commit //p' pgo/aarch64/MANIFEST | cut -c1-9), $(sed -n 's/^date //p' pgo/aarch64/MANIFEST)); $(grep -c 'data file not found' build.log || true) objects without one"
          ctest --preset host --output-on-failure
      - name: configs/default.ini matches the built-in defaults
        run: tools/gen_example_configs.sh && git diff --exit-code configs/default.ini
      - name: po/dsperate.pot matches the sources
        run: python3 tools/i18n_extract.py --check
      # Two tarballs from one build. The standard one is what a distro with a
      # current libstdc++ wants (ROCKNIX packages it as a binary): dynamically
      # linked and stripped. The -static one carries libstdc++/libgcc inside
      # and its debug symbols, for a device whose runtime may be older than
      # the runner's or for a backtrace. Release carries no symbols, so that one
      # is rebuilt as RelWithDebInfo: -g is outside the PGO fingerprint, so the
      # same profile applies. The rebuild is a different binary, so the tests
      # are built and run again on it before it is packed.
      - name: Package
        if: github.event_name != 'pull_request'
        run: tools/ci_package.sh host build/host aarch64 strip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dsperate-linux-aarch64
          path: dsperate-*-linux-aarch64*.tar.gz
  # x86-64: the interpreter and the portable kernels alone (no JIT, no NEON),
  # so the one job that can run the whole suite under the sanitizers, and the
  # place for the configuration with everything optional left out (no SDL, no
  # network, no achievements). Its tarballs are a desktop build for looking at
  # a game or a bug on a PC, not a fast one, and carry no PGO profile.
  x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev libvulkan-dev
      - name: Tests under ASan and UBSan
        run: |
          cmake -S . -B build/san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDSPERATE_SDL=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/san
          # Several tests keep a whole machine on the stack, and ASan's frames are several times the size.
          ulimit -s 262144
          ctest --test-dir build/san --output-on-failure
      - name: Minimal configuration builds and passes
        run: |
          cmake -S . -B build/min -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSPERATE_SDL=OFF -DDSPERATE_NET=OFF -DDSPERATE_CHEEVOS=OFF
          cmake --build build/min
          ctest --test-dir build/min --output-on-failure
      - name: Build and test
        run: |
          cmake --preset host | tee configure.log
          grep -q "Vulkan presenter and 3D raster enabled" configure.log || { echo "::error::Vulkan headers not found: the build would ship without GPU 3D and the Vulkan present"; exit 1; }
          cmake --build --preset host
          ctest --preset host --output-on-failure
      - name: Package
        if: github.event_name != 'pull_request'
        run: tools/ci_package.sh host build/host x86_64 strip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dsperate-linux-x86_64
          path: dsperate-*-linux-x86_64*.tar.gz
  # ARMv7 (the A30 class), cross-built and run under qemu: the second
  # recompiler backend and the 32-bit NEON kernels, against the interpreter
  # and the reference kernels (test_jit, test_kernels). SDL2 and the Vulkan
  # headers come from Ubuntu's armhf ports, which the runner's own package
  # sources do not carry: they are held to amd64 and the ports added beside
  # them. No PGO: pgo/armv7l belongs to the A30 toolchain's compiler, and an
  # A30 itself needs that toolchain's old glibc, not this build.
  armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-security\nComponents: main universe\nArchitectures: armhf\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/armhf.sources
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-arm-linux-gnueabihf qemu-user-static libsdl2-dev:armhf libvulkan-dev:armhf
      - name: Build and test
        run: |
          cmake --preset arm32-cross | tee configure.log
          grep -q "Vulkan presenter and 3D raster enabled" configure.log || { echo "::error::Vulkan headers not found: the build would ship without GPU 3D and the Vulkan present"; exit 1; }
          cmake --build --preset arm32-cross
          ctest --test-dir build/arm32 --output-on-failure
      - name: Package
        if: github.event_name != 'pull_request'
        run: tools/ci_package.sh arm32-cross build/arm32 armv7 arm-linux-gnueabihf-strip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dsperate-linux-armv7
          path: dsperate-*-linux-armv7*.tar.gz
  # Tag v* to publish. The notes are a stand-in (name, tag, changelog link)
  # meant to be edited on GitHub afterwards.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arm64, x86, armv7]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dsperate-linux-*
          merge-multiple: true
      # Fail here, with the listing, rather than in gh's glob error: an
      # artefact uploaded under the wrong name is not downloaded at all.
      - name: Check the tarballs arrived
        run: |
          ls -l
          for a in aarch64 x86_64 armv7; do
            test -f dsperate-${GITHUB_REF_NAME}-linux-$a.tar.gz
            test -f dsperate-${GITHUB_REF_NAME}-linux-$a-static.tar.gz
          done
      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changes="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          else
            changes="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi
          {
            echo "# DSperate ${GITHUB_REF_NAME}"
            echo
            echo "Full changelog: ${changes}"
            echo
            echo "Games run without BIOS or firmware dumps (built-in FreeBIOS and a generated firmware); a set dumped from your own DS unlocks the firmware boot and cycle-exact SWI timing. None is included."
            echo
            echo "Tarballs: \`linux-aarch64\` is the one for a handheld, and the only profile-guided build. \`linux-armv7\` is for 32-bit ARM with NEON, \`linux-x86_64\` a desktop build without the recompiler. Each is dynamically linked and stripped -- the one to package; its \`-static\` twin carries libstdc++/libgcc inside and keeps its debug symbols, for a device whose runtime is older than the build's, or for a backtrace."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dsperate-*-linux-*.tar.gz --title "DSperate ${GITHUB_REF_NAME}" --notes-file notes.md
